---
# jol-deploy — Reusable Deploy Workflow
# Called by spoke repos (jol-site-*) for build → scan → deploy → verify.
name: JOL Deploy Template

on:
  workflow_call:
    inputs:
      tenant:
        description: "Tenant identifier"
        required: true
        type: string
      environment:
        description: "Target environment"
        required: true
        type: string
      image_tag:
        description: "Container image tag (commit SHA)"
        required: true
        type: string
      deploy_strategy:
        description: "Deployment strategy (rolling, canary, blue-green)"
        required: false
        type: string
        default: "rolling"
    secrets:
      deploy_key:
        required: true

permissions:
  contents: read

jobs:
  lint-and-test:
    name: "Lint & Unit Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: YAML lint
        run: pip install yamllint && yamllint -c .yamllint.yaml .
      - name: Unit tests
        run: bash tests/unit/run-tests.sh

  security-scan:
    name: "Security Gates"
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Secret scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
      - name: Container image scanning (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ inputs.tenant }}:${{ inputs.image_tag }}"
          severity: "CRITICAL,HIGH"
      - name: SBOM generation (Syft)
        run: echo "SBOM generation for ${{ inputs.tenant }}"

  build:
    name: "Build & Push"
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - uses: actions/checkout@v4
      - name: Build container image
        run: echo "Building ${{ inputs.tenant }}:${{ inputs.image_tag }}"
      - name: Sign image (cosign)
        run: echo "Signing image ${{ inputs.image_tag }}"
      - name: Push image
        run: echo "Pushing ${{ inputs.tenant }}:${{ inputs.image_tag }}"

  deploy:
    name: "Deploy to ${{ inputs.environment }}"
    runs-on: ubuntu-latest
    needs: build
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy tenant
        run: |
          echo "Deploying ${{ inputs.tenant }} to ${{ inputs.environment }}"
          echo "Strategy: ${{ inputs.deploy_strategy }}"
          ./scripts/deploy.sh ${{ inputs.tenant }} ${{ inputs.environment }}

  verify:
    name: "Post-Deploy Verification"
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4
      - name: Health check
        run: ./scripts/health-check.sh ${{ inputs.tenant }}
      - name: Smoke tests
        run: ./tests/integration/test-smoke.sh ${{ inputs.tenant }}
      - name: Generate deployment record
        run: |
          echo "deployment_id: ${{ github.run_id }}"
          echo "tenant: ${{ inputs.tenant }}"
          echo "environment: ${{ inputs.environment }}"
          echo "image_tag: ${{ inputs.image_tag }}"
          echo "commit_sha: ${{ github.sha }}"
          echo "timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "operator: ${{ github.actor }}"
