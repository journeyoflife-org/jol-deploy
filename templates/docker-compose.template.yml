---
# Docker Compose template for JOL tenant website
# Template variables: {{TENANT_NAME}}, {{DOMAIN}}, {{PORT}}, {{IMAGE_TAG}}
# Generated by jol-deploy

services:
  app:
    image: "{{TENANT_NAME}}:{{IMAGE_TAG}}"
    container_name: "{{TENANT_NAME}}-app"
    restart: unless-stopped
    ports:
      - "{{PORT}}:3000"
    environment:
      - NODE_ENV=production
      - TENANT={{TENANT_NAME}}
      - DOMAIN={{DOMAIN}}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - {{TENANT_NAME}}-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    container_name: "{{TENANT_NAME}}-nginx"
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - {{TENANT_NAME}}-net

networks:
  {{TENANT_NAME}}-net:
    driver: bridge
