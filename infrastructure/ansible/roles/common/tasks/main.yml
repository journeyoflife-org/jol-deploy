---
# Common role — base system configuration for all JOL hosts.

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - jq
      - htop
      - fail2ban
      - unattended-upgrades
      - apt-transport-https
      - ca-certificates
      - gnupg
      - lsb-release
    state: present

- name: Configure timezone
  ansible.builtin.timezone:
    name: "{{ jol_timezone | default('Europe/Vilnius') }}"

- name: Configure NTP
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    mode: "0644"
  notify: Restart chrony

- name: Harden SSH
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - { regexp: '^#?PasswordAuthentication', line: 'PasswordAuthentication no' }
    - { regexp: '^#?PermitRootLogin', line: 'PermitRootLogin prohibit-password' }
    - { regexp: '^#?MaxAuthTries', line: 'MaxAuthTries 3' }
  notify: Restart sshd

- name: Configure UFW default deny
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming

- name: Allow SSH from management VLAN
  community.general.ufw:
    rule: allow
    port: "22"
    src: "10.60.60.0/24"

- name: Enable UFW logging
  community.general.ufw:
    logging: "on"
